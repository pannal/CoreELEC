# Compressed RAM swap (zram) configuration — build defaults.
#
# This file lives on the read-only system partition and cannot be
# edited. To override, copy /storage/.config/zram.conf.sample to
# /storage/.config/zram.conf, edit it, then reboot (or
# `systemctl restart zram-swap`). Values there win over these.

# Size of the zram device in MiB. Actual physical RAM cost is ~1/3
# of this when fully populated (lz4 typical compression ratio).
ZRAM_SIZE_MB="@ZRAM_SIZE_MB@"

# Set to "yes" to enable, "no" to disable.
ZRAM_ENABLED="@ZRAM_ENABLED_DEFAULT@"
